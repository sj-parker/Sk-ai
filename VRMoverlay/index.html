<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRM Streaming App</title>
    <!-- TWEEN.js для плавных переходов анимаций -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>
    <div id="container">
        <canvas id="canvas"></canvas>

        <!-- Кнопка для открытия меню, когда оно скрыто -->
        <button id="toggleControls" title="Показать настройки">⚙️</button>

        <div class="controls" id="controlsPanel">
            <h2>
                <span>🎮 Управление VRM</span>
                <button id="closeControls"
                    style="margin-left:auto; background:none; border:none; color:white; cursor:pointer;">✕</button>
            </h2>

            <div class="tabs">
                <button class="tab-btn active" data-tab="general">Общие</button>
                <button class="tab-btn" data-tab="animations">Анимации</button>
                <button class="tab-btn" data-tab="system">Система</button>
            </div>

            <!-- Tab: General -->
            <div id="tab-general" class="tab-content active">
                <div class="control-group">
                    <label for="modelSelect">Модель:</label>
                    <select id="modelSelect">
                        <option value="mSkai_art.vrm">mSkai_art.vrm</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="cameraDistance">Расстояние камеры:</label>
                    <input type="range" id="cameraDistance" min="1" max="10" step="0.1" value="3">
                </div>

                <div class="control-group">
                    <label for="rotationSpeed">Поворот модели:</label>
                    <input type="range" id="rotationSpeed" min="-180" max="180" step="1" value="180">
                    <button class="btn btn-secondary" id="faceCameraBtn">👤 Лицом к камере</button>
                </div>

                <div class="control-group">
                    <label for="lightIntensity">Интенсивность света:</label>
                    <input type="range" id="lightIntensity" min="0" max="2" step="0.1" value="1">
                    <button class="btn btn-secondary" id="resetLightBtn">🔄 Сброс света</button>
                </div>
            </div>

            <!-- Tab: Animations -->
            <div id="tab-animations" class="tab-content">
                <div class="control-group">
                    <label>Настройки анимации (Тюнинг):</label>
                    <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                        <label for="swayHead" style="font-size: 11px;">Качание головы: <span
                                id="swayHeadValue">0.05</span></label>
                        <input type="range" id="swayHead" min="0" max="0.2" step="0.001" value="0.05">

                        <label for="swayBody" style="font-size: 11px;">Качание тела: <span
                                id="swayBodyValue">0.05</span></label>
                        <input type="range" id="swayBody" min="0" max="0.2" step="0.001" value="0.05">

                        <label for="breathInt" style="font-size: 11px;">Дыхание: <span
                                id="breathIntValue">0.01</span></label>
                        <input type="range" id="breathInt" min="0" max="0.2" step="0.001" value="0.01">

                        <div style="margin-top: 10px; display: flex; gap: 10px;">
                            <label style="font-size: 12px; display: flex; align-items: center; gap: 5px;">
                                <input type="checkbox" id="mouseTracking" checked> Слежение за мышью
                            </label>
                            <label style="font-size: 12px; display: flex; align-items: center; gap: 5px;">
                                <input type="checkbox" id="randomActions" checked> Случайные движения
                            </label>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label>Эмоции:</label>
                    <div id="emotionControls">
                        <button class="emotion-btn" data-action="manualBlink">😉 Моргнуть</button>
                        <button class="emotion-btn" data-action="setEmotion" data-emotion="happy">😊 Радость</button>
                        <button class="emotion-btn" data-action="setEmotion" data-emotion="sad">😢 Грусть</button>
                        <button class="emotion-btn" data-action="setEmotion" data-emotion="angry">😠 Злость</button>
                        <button class="emotion-btn" data-action="setEmotion" data-emotion="surprised">😲
                            Удивление</button>
                        <button class="emotion-btn" data-action="setEmotion" data-emotion="neutral">😐
                            Нейтрально</button>
                        <button class="emotion-btn" data-action="resetEmotions" style="grid-column: span 2;">🔄 Сбросить
                            эмоции</button>
                    </div>
                </div>
                <!-- Dynamic animation controls will be injected here -->
                <div id="dynamicAnimationControls"></div>
            </div>

            <!-- Tab: System -->
            <div id="tab-system" class="tab-content">
                <div class="control-group">
                    <label>Действия:</label>
                    <button class="btn" id="fullscreenBtn">🖥️ Полноэкранный режим</button>
                    <button class="btn" id="screenshotBtn">📸 Сделать скриншот</button>
                    <button class="btn" id="performanceBtn">🎯 Производительность</button>
                    <button class="btn" id="websocketTestBtn">🔌 Тест WebSocket</button>
                </div>
                <!-- Dynamic system controls will be injected here -->
                <div id="dynamicSystemControls"></div>
            </div>
        </div>

        <div class="streaming-info">
            <h3>📺 Статус трансляции</h3>
            <p>Разрешение: <span id="resolution">1920x1080</span></p>
            <p>FPS: <span id="fps">60</span></p>
            <p>Статус: <span id="status">Готово</span></p>
            <p>WebSocket: <span id="ws-status" class="status-disconnected">Отключен</span></p>
        </div>

        <div class="status-toast" id="statusBar">
            Загрузка модели...
        </div>

        <div class="loading" id="loading">
            ⏳ Загрузка VRM модели...
        </div>
    </div>

    <div id="vrm-timing"
        style="position:fixed;bottom:10px;right:10px;background:rgba(0,0,0,0.7);color:#fff;padding:8px;border-radius:6px;z-index:9999;font-size:12px;pointer-events:none;">
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Наши скрипты -->
    <script src="src/animation-system.js"></script>
    <script src="src/animation-integration.js"></script>
    <script src="src/performance-optimizer.js"></script>
    <script src="src/vrm-websocket.js"></script>
    <script src="src/main.js"></script>
    <script>
        // Simple toggle logic for the sidebar
        document.getElementById('closeControls').addEventListener('click', () => {
            document.getElementById('controlsPanel').classList.add('collapsed');
        });
        document.getElementById('toggleControls').addEventListener('click', () => {
            document.getElementById('controlsPanel').classList.remove('collapsed');
        });

        setInterval(() => {
            const hist = window.vrmTimingHistory || [];
            let html = '<b>VRM Timing</b><br>';
            for (const t of hist.slice(-5).reverse()) {
                html += `${t.type}: <b>${t.delay.toFixed(1)}ms</b><br>`;
            }
            document.getElementById('vrm-timing').innerHTML = html;
        }, 1000);
    </script>
</body>

</html>
