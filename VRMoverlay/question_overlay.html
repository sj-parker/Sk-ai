<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Question Overlay</title>
    <style>
        :root {
            --question-overlay-top: 15vh;
            --question-overlay-left: 50%;
            --question-overlay-transform: translateX(-50%);
            --question-overlay-font-size: 1.8em;
            --question-overlay-max-width: 85vw;
            --question-overlay-padding: 0.6em 1.8em;
            --question-overlay-mobile-font-size: 1.1em;
            --question-overlay-mobile-padding: 0.4em 0.8em;
        }

        body {
            background: transparent;
            margin: 0;
            overflow: hidden;
        }

        #question-text {
            position: absolute;
            top: var(--question-overlay-top);
            left: var(--question-overlay-left);
            transform: var(--question-overlay-transform);
            color: white;
            font-size: var(--question-overlay-font-size);
            font-family: 'Segoe UI', Arial, sans-serif;
            /* Усиленная тень для читаемости на прозрачном фоне */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.9);
            background: rgba(0, 0, 0, 0.7);
            /* Полупрозрачный черный фон */
            backdrop-filter: blur(5px);
            /* Эффект размытия фона */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: var(--question-overlay-padding);
            max-width: var(--question-overlay-max-width);
            word-break: break-word;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            line-height: 1.4;
            opacity: 0;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            box-sizing: border-box;
            text-align: center;
        }

        #question-text.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #question-text.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(-20px);
        }

        /* Иконка вопроса */
        #question-text::before {
            content: '💭';
            margin-right: 0.5em;
            font-size: 1.2em;
        }

        @media (max-width: 600px) {
            #question-text {
                font-size: var(--question-overlay-mobile-font-size);
                padding: var(--question-overlay-mobile-padding);
                line-height: 1.2;
            }
        }

        @media (max-width: 1200px) {
            #question-text {
                font-size: 1.5em;
                line-height: 1.3;
            }
        }

        @media (max-width: 800px) {
            #question-text {
                font-size: 1.3em;
                line-height: 1.25;
            }
        }

        /* Индикатор подключения (скрытый по умолчанию) */
        #connection-status {
            position: fixed;
            bottom: 10px;
            right: 10px;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 5px;
            font-size: 12px;
            display: none;
            /* Скрываем в production */
        }

        #connection-status.connected {
            background: rgba(40, 167, 69, 0.7);
        }

        #connection-status.disconnected {
            background: rgba(220, 53, 69, 0.7);
        }
    </style>
</head>

<body>
    <div id="question-text" class="hidden"></div>
    <!-- <div id="connection-status" class="disconnected">Отключено</div> --> <!-- Раскомментируйте для отладки -->

    <script>
        // Настройки WebSocket для вопросов пользователя
        const WS_HOST = '192.168.1.4';
        const WS_PORT = 31994; // Новый порт для вопросов пользователя (31992 - VRM, 31993 - ответы)
        const FADE_DURATION = 300; // мс
        const DISPLAY_DURATION = 300000; // Время отображения вопроса (5 минут)

        const questionDiv = document.getElementById("question-text");
        const statusDiv = document.getElementById("connection-status");
        let hideTimeout = null;
        let ws = null;

        function showQuestion(text) {
            // Отменяем предыдущий таймаут скрытия, если он есть
            if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
            }

            // Если текст пустой, скрываем элемент
            if (!text || !text.trim()) {
                hideQuestion();
                return;
            }

            // Обновляем текст и показываем
            questionDiv.textContent = text;
            questionDiv.classList.remove('hidden');
            questionDiv.classList.add('visible');

            console.log('💭 Показываем вопрос:', text);

            // Автоматически скрываем вопрос через DISPLAY_DURATION
            hideTimeout = setTimeout(() => {
                hideQuestion();
            }, DISPLAY_DURATION);
        }

        function hideQuestion() {
            questionDiv.classList.remove('visible');
            questionDiv.classList.add('hidden');

            // Очищаем текст после анимации скрытия
            setTimeout(() => {
                if (questionDiv.classList.contains('hidden')) {
                    questionDiv.textContent = '';
                }
            }, FADE_DURATION);
        }

        function updateConnectionStatus(connected) {
            if (statusDiv) {
                if (connected) {
                    statusDiv.textContent = 'Подключено';
                    statusDiv.className = 'connected';
                } else {
                    statusDiv.textContent = 'Отключено';
                    statusDiv.className = 'disconnected';
                }
            }
        }

        function connectWS() {
            try {
                const wsUrl = `ws://${WS_HOST}:${WS_PORT}`;
                console.log(`🔌 Подключение к WebSocket для вопросов: ${wsUrl}`);

                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    console.log(`✅ WebSocket подключен: ${wsUrl}`);
                    updateConnectionStatus(true);
                };

                ws.onmessage = (event) => {
                    const text = event.data;
                    console.log('📨 Получен вопрос:', text);
                    showQuestion(text);
                };

                ws.onclose = (event) => {
                    console.log(`❌ WebSocket закрыт (код: ${event.code})`);
                    updateConnectionStatus(false);

                    // Переподключаемся через 2 секунды
                    setTimeout(connectWS, 2000);
                };

                ws.onerror = (error) => {
                    console.error('❌ WebSocket ошибка:', error);
                    updateConnectionStatus(false);
                };
            } catch (error) {
                console.error('❌ Ошибка создания WebSocket:', error);
                updateConnectionStatus(false);

                // Пытаемся переподключиться через 5 секунд
                setTimeout(connectWS, 5000);
            }
        }

        // Запускаем подключение при загрузке страницы
        connectWS();

        // Переподключаемся при возвращении на вкладку
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && (!ws || ws.readyState !== WebSocket.OPEN)) {
                console.log('🔄 Переподключение при возвращении на вкладку');
                connectWS();
            }
        });
    </script>
</body>

</html>
